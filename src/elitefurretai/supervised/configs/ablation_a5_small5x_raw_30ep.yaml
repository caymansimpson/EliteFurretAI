# NOTE: this is cool-bee-85
# ablation_a5_small5x_raw_30ep: A3 architecture + RAW featureset, 30 epochs
# Combines the action-accuracy winner (A3 ~5x smaller) with the value-head winner (A2 raw)
# trained for 30 epochs to match the curious-darkness-77 reference budget.
#
# Hypothesis: RAW featureset cures A3's value-head collapse, giving us:
#   - Strong action accuracy (A3 was best of all 10-epoch ablations)
#   - Strong Win Corr (A2 RAW had highest of all ablations)
#   - 4-5x faster RL forward pass (A3 size)

# Architecture — same as A3 (~26.7M params, 4.7x smaller than baseline)
transformer_layers: 4
transformer_heads: 8
transformer_ff_dim: 1024
transformer_dropout: 0.1
use_causal_mask: true
use_decision_tokens: true
grouped_encoder_aggregated_dim: 2048
grouped_encoder_hidden_dim: 256
pokemon_attention_heads: 8
early_layers: [1024, 512, 512]
late_layers: [512, 512]
turn_head_layers: [512, 256, 256]
teampreview_head_layers: [256, 128]
teampreview_head_dropout: 0.15
teampreview_attention_heads: 2

# Training — 30 epochs to match reference budget
num_epochs: 30
batch_size: 128
learning_rate: 5.44e-05
optimizer: AdamW
weight_decay: 0.000144
lr_schedule: ReduceLROnPlateau
max_grad_norm: 1.0
dropout: 0.2
accumulation_steps: 1
seed: 21

# Loss weights
turn_loss_weight: 1.0
move_loss_weight: 1.0
switch_loss_weight: 1.0
teampreview_loss_weight: 1.0
win_loss_weight: 0.35
turn_loss_type: topk
train_topk_k: 2025
entropy_weight: 0.0
focal_alpha: 0.25
focal_gamma: 2.0

# Value head
num_value_bins: 51
value_min: -1.0
value_max: 1.0

# Data — RAW featureset (combines A3 architecture with A2's featureset)
embedder_feature_set: raw
battle_format: gen9vgc2023regc
max_seq_len: 40
keep_force_switch: false

# DataLoader
num_workers: 3
files_per_worker: 3
prefetch_factor: 2
worker_batch_size: 128
persistent_workers: true

# Hardware
device: cuda
save_path: data/models/supervised/
