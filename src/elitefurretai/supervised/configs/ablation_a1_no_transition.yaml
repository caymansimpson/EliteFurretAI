# ablation_a1_no_transition: drop transition features (37 dims)
# Same architecture as B0; uses full_no_transition featureset (5185 dims vs 5222)
# Hypothesis: minimal BC accuracy drop, negligible speed gain, riskier for RL

# Architecture (identical to curious-darkness-77)
transformer_layers: 7
transformer_heads: 16
transformer_ff_dim: 2048
transformer_dropout: 0.1
use_causal_mask: true
use_decision_tokens: true
grouped_encoder_aggregated_dim: 4096
grouped_encoder_hidden_dim: 512
pokemon_attention_heads: 16
early_layers: [2048, 1024, 1024]
late_layers: [1024, 1024]
turn_head_layers: [1024, 512, 512]
teampreview_head_layers: [512, 256]
teampreview_head_dropout: 0.15
teampreview_attention_heads: 2

# Training
num_epochs: 10
batch_size: 128
learning_rate: 5.44e-05
optimizer: AdamW
weight_decay: 0.000144
lr_schedule: ReduceLROnPlateau
max_grad_norm: 1.0
dropout: 0.2
accumulation_steps: 1
seed: 21

# Loss weights
turn_loss_weight: 1.0
move_loss_weight: 1.0
switch_loss_weight: 1.0
teampreview_loss_weight: 1.0
win_loss_weight: 0.35
turn_loss_type: topk
train_topk_k: 2025
entropy_weight: 0.0
focal_alpha: 0.25
focal_gamma: 2.0

# Value head
num_value_bins: 51
value_min: -1.0
value_max: 1.0

# Data — key ablation knob
embedder_feature_set: full_no_transition
battle_format: gen9vgc2023regc
max_seq_len: 40
keep_force_switch: false

# DataLoader
num_workers: 3
files_per_worker: 3
prefetch_factor: 2
worker_batch_size: 128
persistent_workers: true

# Hardware
device: cuda
save_path: data/models/supervised/
