# multiformat.yaml — multi-format run including the mega-evolution format (regMA).
#
# Derived from may26.yaml. Adds gen9championsvgc2026regma to the curriculum
# alongside the two tera formats. The tera:mega "ratio" is simply the
# battle_formats weights (no separate knob); tune them as needed.
#
# IMPORTANT — this run uses the NEW mega-aware featureset (Mega Stones in the
# item vocab + prospective mega-form features + mega scalar flags). Before
# launching:
#   1. Re-process training tensors with the new embedder (Task A4).
#   2. Re-finetune BC on the new featureset (Task A5) and point the
#      initialize_path / bc_model_path below at that NEW checkpoint.
#   3. Do NOT set resume_from to any pre-mega checkpoint — the embedding_size
#      changed, so old checkpoints are dimension-incompatible.

algorithm:
  clip_range: 0.2
  ent_coef: 0.005
  ent_coef_end: 0.001
  gae_lambda: 0.95
  gamma: 1
  max_grad_norm: 0.5
  rnad_alpha: 0.3
  ppo_epochs: 5
  vf_coef: 0.5

portfolio:
  max_portfolio_size: 10
  portfolio_add_interval: 500
  portfolio_update_strategy: recent

exploration:
  temperature_start: 1.0
  temperature_end: 0.5
  exploration_anneal_steps: 10000
  top_p: 0.95

optimizer:
  type: adamw
  weight_decay: 0.0001
  warmup_steps: 100
  schedule: cosine
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0001
  heads_lr: 0.00003
  heads_weight_decay: 0.0
  lr: 0.00001

value_head:
  num_value_bins: 51
  value_min: -1.0
  value_max: 1.0
  value_label_smoothing: 0.05

architecture:
  value_to_trunk_grad_scale: 0.15
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 2048
  transformer_dropout: 0.1
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0.2
  early_attention_heads: 16
  late_attention_heads: 32
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0.15
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]
  value_head_layers: [512, 512, 256]
  max_seq_len: 40
  number_bank_hp_bins: 100
  number_bank_stat_bins: 600
  number_bank_power_bins: 250
  number_bank_embedding_dim: 16

hardware:
  batch_size: 32
  batch_timeout: 0.005
  device: cuda
  max_battle_steps: 30
  num_battles_per_pair: 48
  max_concurrent_battles_per_player: 48
  num_players: 16
  num_servers: 4
  num_workers: 4
  showdown_start_port: 8000
  compile_inference_model: default

curriculum:
  # Tera:mega ratio = these weights. Balanced 3-way default (tune at runtime).
  battle_formats:
    gen9vgc2024regg: 0.34
    gen9vgc2026regi: 0.33
    gen9championsvgc2026regma: 0.33
  base_team_path: data/teams
  opponent_team_pool_path:
    gen9vgc2024regg: constrained
    gen9vgc2026regi: null
    # regMA teams are flat .txt files at the format root → sample all (null).
    gen9championsvgc2026regma: null
  agent_team_path:
    gen9vgc2024regg: setup
    gen9vgc2026regi: setup
    # "" resolves to the format root (data/teams/gen9championsvgc2026regma/),
    # which holds the flat .txt teams; regMA has no setup/ subdir.
    gen9championsvgc2026regma: ""
  curriculum_weights:
    self_play: 0.56
    bc_player: 0.03
    exploiters: 0
    ghosts: 0.32
    max_damage: 0.03
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.03
    vgc_bench_baseline: 0.03
    train_exploiter: 0
  adaptive_agent_axis:
    enabled: true
    min_samples: 100
  adaptive_team_axis:
    enabled: true
    min_samples: 100
  max_exploiter_models: 5
  max_ghosts: 5
  # UPDATE to the new mega-aware BC checkpoint produced by Task A5:
  bc_model_path: data/models/supervised/MEGA_BC_CHECKPOINT_best.pt
  vgc_bench_checkpoint_path: data/models/vgc-bench-bcsp-reg_all-seed1-98304000.zip
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench-bcsp/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  embedder_feature_set: raw
  # UPDATE to the new mega-aware BC checkpoint produced by Task A5:
  initialize_path: data/models/supervised/MEGA_BC_CHECKPOINT_best.pt
  # Old-featureset checkpoints are dimension-incompatible with the mega
  # featureset — start fresh from the re-finetuned BC, do not resume.
  resume_from: null
  max_updates: 100000
  save_dir: data/models/rl
  train_batch_size: 128
  checkpoint_interval: 500
  log_interval: 1
  use_wandb: true
  wandb_project: elitefurretai-instruct
  wandb_run_name: null
  memory_watchdog_threshold_gb: 20.0

exploiter:
  batch_size: 64
  graduation_threshold: 0.65
  graduation_window: 1000
  max_updates_per_generation: 5000
  victim_refresh_interval: 1000
  warmup_updates: 200
  lr: 0.0001
  ent_coef: 0.02

eval:
  enabled: false
