# may15.yaml — fresh BC-initialized run with raised RNaD regularization.
#
# Why this config exists
# ----------------------
# firm-field-41 (the 12h sep_arch run resumed from pretty-jazz-4) showed
# loss-vs-capability divergence: total/policy/value losses improved but
# win rates against fixed baselines collapsed (vgc_bench 0.11→0.04 in 674
# steps; bc_player 0.50→0.41). Diagnosis in
# planning/stage2/2026-05-15-10-49-per-run-dir-and-firm-field-41-diagnosis.md:
#
#   1. Value-gradient dominance through the shared trunk
#      (vf_coef × value_loss / |policy_loss| sustained at 4-10×).
#   2. R-NaD regularization was functionally off — α × rnad_loss
#      contributed ~0.005 of total loss (0.5%), so there was no tether
#      preventing the policy from drifting away from BC-anchored play.
#
# This config tests the cheapest intervention first: re-anchor with raised
# RNaD α from a clean BC initialization, no chain-of-resume confounders.
#
# What changes vs sep_arch.yaml
# -----------------------------
# - `resume_from: null` — fresh start. step counter from 0.
# - `initialize_path: cool-bee-85-finetune_best.pt` — BC weights load
#   into encoder + trunk + policy head; new value_ff_stack + reshaped
#   win_head are fresh-initialized (same partial-load path as sep_arch).
# - `rnad_alpha: 0.3` (6× the prior 0.05). With rnad_loss ≈ 0.1 at
#   convergence, this lifts the RNaD contribution from 0.005 → ~0.03 of
#   total loss (~3%) — actually meaningful regularization.
# - Architecture / heads / topology / optimizer match sep_arch's
#   *current* state (heads kept at original shapes for clean BC load —
#   the [768, ...] deepening was reverted because strict=False can't
#   span size mismatches on shared keys).
#
# Note on the new per-run-dir behavior
# ------------------------------------
# As of 2026-05-15, train.py writes each wandb run to its own
# save_dir/<wandb_run_name>/ subdir regardless of resume status (see
# planning doc above). Since this is a fresh run (no resume_from), the
# per-run-dir change is transparent — checkpoints land cleanly in their
# own directory from step 0.
#
# What to compare against
# -----------------------
# Primary comparison is firm-field-41 (sep_arch + rnad_alpha=0.05 +
# resume from pretty-jazz-4/step_365). Success looks like:
#   - win_rate_vgc_bench_baseline stabilizing ≥ 0.10 (firm-field-41
#     decayed to 0.04)
#   - win_rate_bc_player ≥ 0.50 and not trending down
#   - gradient-dominance ratio shrinking from the ~10× start as the
#     fresh value head converges and the RNaD tether bites
# If after ~200 updates the win-rate trajectory still looks like
# firm-field-41's, the cheap intervention isn't enough and the next
# move is gradient routing (either GradScale on value→trunk, or the
# per-head-transformer architecture discussed in the planning doc).

algorithm:
  clip_range: 0.2
  ent_coef: 0.005
  ent_coef_end: 0.001
  gae_lambda: 0.95
  gamma: 1
  max_grad_norm: 0.5
  # Raised 0.05 → 0.3. With rnad_loss observed at ~0.05-0.1 across
  # firm-field-41, this lifts the regularization contribution from
  # essentially-zero to a meaningful fraction (~3%) of total loss.
  rnad_alpha: 0.3
  ppo_epochs: 10
  vf_coef: 0.5

portfolio:
  max_portfolio_size: 5
  portfolio_add_interval: 100
  portfolio_update_strategy: recent

exploration:
  temperature_start: 1.0
  temperature_end: 0.5
  temperature_anneal_steps: 10000
  top_p: 0.95

optimizer:
  type: adamw
  weight_decay: 0.0001
  warmup_steps: 100
  schedule: cosine
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0001
  heads_lr: 0.00003
  heads_weight_decay: 0.0
  lr: 0.00001

value_head:
  num_value_bins: 51
  value_min: -1.0
  value_max: 1.0

architecture:
  # Trunk: matches cool-bee-85-finetune for clean BC partial-load.
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 1024
  transformer_dropout: 0.1
  # Encoder
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0.2
  early_attention_heads: 16
  late_attention_heads: 32
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  # Decision heads — sizes match sep_arch (kept at [512, ...] / [256, ...]
  # for BC partial-load compatibility; deepening to [768, ...] was reverted
  # because strict=False can't span size mismatches on shared keys).
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0.15
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]
  # Deep value head: 3 ResidualBlocks between late_ff_stack output and
  # the final Linear projection to num_value_bins. Gives the value head
  # integrative depth so return-prediction work happens after the trunk
  # rather than inside it. The legacy 2-layer win_head from BC won't
  # strict-load and is fresh-initialized.
  value_head_layers: [512, 512, 256]
  max_seq_len: 40
  # Number bank embeddings
  number_bank_hp_bins: 100
  number_bank_stat_bins: 600
  number_bank_power_bins: 250
  number_bank_embedding_dim: 16

hardware:
  batch_size: 32
  batch_timeout: 0.005
  device: cuda
  max_battle_steps: 30
  num_battles_per_pair: 48
  max_concurrent_battles_per_player: 48
  num_players: 16
  num_servers: 4
  num_workers: 4
  showdown_start_port: 8000
  compile_inference_model: default

curriculum:
  battle_format: gen9vgc2024regg
  base_team_path: data/teams
  team_pool_path: constrained
  agent_team_path: constrained # TODO: is this right?
  bc_model_path: data/models/supervised/cool-bee-85-finetune_best.pt
  curriculum_weights:
    # Fresh-start curriculum: ghosts/ and exploiters/ directories are
    # empty on a fresh run, so ghosts/exploiters opponents fall back to
    # self_play until snapshots accumulate. train_exploiter still spawns
    # a fresh exploiter learner that will begin producing snaps from
    # scratch. Weights match sep_arch's Plan C mix; opponent pool's
    # fallback handles the empty-pool case gracefully.
    self_play: 0.35
    bc_player: 0.05
    exploiters: 0
    ghosts: 0.1
    max_damage: 0.15
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.15
    vgc_bench_baseline: 0.2
    train_exploiter: 0
  adaptive_curriculum: false
  max_exploiter_models: 5
  max_ghosts: 5
  vgc_bench_checkpoint_path: data/models/vgc-bench-sb3-model.zip
  external_vgcbench_usernames:
    - VGCBENCH
  external_vgcbench_startup_wait_s: 10.0
  auto_launch_external_vgcbench: false
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  embedder_feature_set: raw
  # BC partial-load: trunk/encoder/policy head load from cool-bee-85; the
  # new value_ff_stack + reshaped win_head are fresh-initialized. Strict
  # load is bypassed in train.py's initialize_path branch.
  initialize_path: data/models/supervised/cool-bee-85-finetune_best.pt
  # Fresh run — no resume. Per-run-dir behavior (train.py:1106-1149) means
  # checkpoints will be written under data/models/rl/<wandb_run_name>/
  # from step 0.
  resume_from: null
  max_updates: 100000
  save_dir: data/models/rl
  train_batch_size: 128
  checkpoint_interval: 100
  log_interval: 1
  use_wandb: true
  wandb_project: elitefurretai-instruct
  wandb_run_name: null
  # 2026-05-15: 22 → 24 GB to tolerate the frozen subprocess's transient
  # compile peak. Breakdown at peak (light-capybara-58 / dulcet-sun-59):
  # trainer 3.8 + showdown 3.8 + vgcbench 3.2 + workers 4.1 + frozen
  # subprocess 7.2 (compile peak) ≈ 22.1 GB combined RSS. Post-compile
  # the frozen subprocess drops to ~2-3 GB → steady-state ~17-18 GB,
  # well under 23 GB physical. Combined RSS double-counts shared pages,
  # so 24 GB combined ≈ ~18 GB actual; physical RAM isn't at risk.
  memory_watchdog_threshold_gb: 24.0

exploiter:
  batch_size: 64
  graduation_threshold: 0.65
  graduation_window: 1000
  max_updates_per_generation: 5000
  victim_refresh_interval: 1000
  warmup_updates: 200
  lr: 0.0001
  ent_coef: 0.02
