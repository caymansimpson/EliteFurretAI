# Benchmark config for measuring the K=3 PPO mini-epochs default (post 2026-05-03
# RL throughput optimizations). Mirrors single_team.yaml topology, but:
#   - max_updates: 200 (a quality benchmark window — see plan Phase 3 §3.5)
#   - use_wandb: false (avoid network noise; train.py logs are parsed directly)
#   - vgc_bench_baseline weight zeroed and auto_launch disabled (removes
#     external VGCBench networking variance from the b/s number; the 0.3
#     weight is reallocated to self_play so total opponent mix sums to 1.0)
#   - save_dir: data/benchmarks/2026-05-03-K3 (kept separate from training runs)
#
# Pair this with benchmark_K1.yaml for the K=1 comparison run.

algorithm:
  clip_range: 0.2
  ent_coef: 0.02
  ent_coef_end: 0.001
  gae_lambda: 0.95
  gamma: 1
  max_grad_norm: 0.5
  rnad_alpha: 0.05
  vf_coef: 0.5
  ppo_epochs: 3

portfolio:
  max_portfolio_size: 5
  portfolio_add_interval: 25
  portfolio_update_strategy: recent

exploration:
  temperature_start: 1.0
  temperature_end: 0.5
  temperature_anneal_steps: 50000
  top_p: 0.95

optimizer:
  type: adamw
  weight_decay: 0.0001
  warmup_steps: 100
  schedule: cosine
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0001
  heads_lr: 0.00003
  heads_weight_decay: 0.0
  lr: 0.00001

value_head:
  num_value_bins: 51
  value_min: -1.0
  value_max: 1.0

architecture:
  use_transformer: true
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 1024
  transformer_dropout: 0.1
  use_decision_tokens: true
  use_causal_mask: true
  lstm_layers: 4
  lstm_hidden_size: 512
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0.2
  early_attention_heads: 16
  late_attention_heads: 32
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0.15
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]
  max_seq_len: 40
  number_bank_hp_bins: 100
  number_bank_stat_bins: 600
  number_bank_power_bins: 250
  number_bank_embedding_dim: 16

hardware:
  batch_size: 4
  batch_timeout: 0.005
  device: cuda
  max_battle_steps: 30
  num_battles_per_pair: 32
  num_players: 12
  num_servers: 4
  num_workers: 4
  showdown_start_port: 8000
  use_mixed_precision: true

curriculum:
  battle_format: gen9vgc2024regg
  base_team_path: data/teams
  team_pool_path: constrained
  agent_team_path: data/teams/gen9vgc2024regg/constrained/naicchampion.txt
  bc_model_path: data/models/supervised/cool-bee-85-finetune_best.pt
  curriculum_weights:
    self_play: 0.7
    bc_player: 0.1
    exploiters: 0.0
    ghosts: 0.1
    max_damage: 0.05
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.05
    vgc_bench_baseline: 0.0
  adaptive_curriculum: false
  max_exploiter_models: 5
  max_ghosts: 5
  vgc_bench_checkpoint_path: data/models/vgc-bench-sb3-model.zip
  external_vgcbench_usernames: []
  external_vgcbench_startup_wait_s: 0.0
  auto_launch_external_vgcbench: false
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  embedder_feature_set: raw
  initialize_path: data/models/supervised/cool-bee-85-finetune_best.pt
  resume_from: null
  max_updates: 200
  save_dir: data/benchmarks/2026-05-03-K3
  train_batch_size: 256
  checkpoint_interval: 100
  log_interval: 1
  use_wandb: false
  wandb_project: elitefurretai-benchmark
  wandb_run_name: bench-K3
  train_exploiters: false
