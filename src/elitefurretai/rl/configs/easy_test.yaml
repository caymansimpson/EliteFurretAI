# Only non-default values are listed. Defaults live in
# `src/elitefurretai/rl/config.py` (the `@dataclass` definitions).
algorithm:
  ent_coef: 0.02
  gamma: 1
  rnad_alpha: 0.15
  vf_coef: 1.0
  ppo_epochs: 4

portfolio:
  portfolio_add_interval: 25

optimizer:
  backbone_lr: 0.00001
  heads_lr: 0.00003
  lr: 0.00001

architecture:
  # Multiplier on value-head gradient flowing back into the shared trunk;
  # 1.0 = legacy behavior. Override <1.0 to dampen value-side dominance of
  # shared representations (see may16.yaml + 2026-05-16-22-30 planning doc).
  value_to_trunk_grad_scale: 1.0
  # Transformer backbone (matching cool-bee-85-finetune: ~26.7M params, ~5x smaller than
  # curious-darkness-77; trained with raw featureset; finetuned for 15 additional epochs).
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 1024
  # Encoder
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  # Decision heads
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]

hardware:
  batch_size: 8
  batch_timeout: 0.02
  num_battles_per_pair: 16
  # null = poke-env's default of 1 (battles serialise behind the previous
  # battle's duration). Set to num_battles_per_pair to remove the 5-30s
  # slow-handler tax diagnosed in Track C of the 2026-05-12 planning doc.
  max_concurrent_battles_per_player: null
  num_players: 18
  num_servers: 6
  num_workers: 6

curriculum:
  # Single format, single agent team, single opponent team.
  # Both *_team_path entries are relative to <base_team_path>/<format>/ and
  # point at the same .txt file so every rollout is a mirror match on this
  # one team. Swap either side to change the matchup.
  battle_formats:
    gen9vgc2024regg: 1.0
  base_team_path: data/teams
  agent_team_path: constrained/naicchampion.txt
  opponent_team_pool_path: constrained/naicchampion.txt
  # cool-bee-85-finetune is pre-2026-05-24 embedder (input dim 5,032);
  # no longer loadable against the current 5,056-dim embedder. Run with
  # no BC init / no BC opponent until a replacement is trained.
  bc_model_path: null
  curriculum_weights:
    self_play: 0.5
    bc_player: 0
    exploiters: 0.0
    ghosts: 0.15
    max_damage: 0.15
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.1
    vgc_bench_baseline: 0.1
    train_exploiter: 0.0  # off; bump to 0.20 to activate in-process exploiter co-training
  adaptive_agent_axis:
    enabled: false
  max_exploiter_models: 5
  max_ghosts: 5
  vgc_bench_checkpoint_path: data/models/vgc-bench-bcsp-reg_all-seed1-98304000.zip
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench-bcsp/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  # No BC warm-start: cool-bee-85-finetune is incompatible with the
  # post-2026-05-24 embedder (5,032 → 5,056 input dim). Train from scratch
  # until a new BC checkpoint is available.
  initialize_path: null
  resume_from: data/models/rl/bright-pine-189/main_model_step_144.pt
  save_dir: data/models/rl
  train_batch_size: 128
  checkpoint_interval: 100

# ── Exploiter co-training (in-process, graduation-based)
# ─ gated by curriculum train_exploiter weight ─
exploiter:
  batch_size: 64
  graduation_threshold: 0.65
  graduation_window: 1000
  max_updates_per_generation: 5000
  victim_refresh_interval: 1000
  warmup_updates: 200
  lr: 0.0001
  ent_coef: 0.02
