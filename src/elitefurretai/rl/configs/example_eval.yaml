# example_eval.yaml — standalone evaluate_model.py CLI config.
#
# Mostly defaults; runs the four configured baselines (SHP, MaxDamage,
# BCPlayer, VGCBench) against a checkpoint on three formats:
#   - gen9vgc2024regg (regg)
#   - gen9vgc2026regi (regi)
#   - gen9championsvgc2026regma (championsma)
# Agent uses the 'setup' team pool on regg/regi; championsma falls back to
# the format root (null).
#
# Run:
#   python -m elitefurretai.rl.analyze.evaluate_model \
#       --checkpoint <path/to/checkpoint.pt> \
#       --config src/elitefurretai/rl/configs/example_eval.yaml \
#       --output /tmp/example_eval.json \
#       --num-servers 4

# Curriculum drives format selection + team paths. evaluate_model reads
# only the eval, curriculum, and hardware.device sections; all other
# RNaDConfig sections fall back to defaults.
curriculum:
  battle_formats:
    gen9vgc2024regg: 0.4
    gen9vgc2026regi: 0.4
    gen9championsvgc2026regma: 0.2
  base_team_path: data/teams
  agent_team_path:
    gen9vgc2024regg: setup
    gen9vgc2026regi: setup
    gen9championsvgc2026regma: null
  opponent_team_pool_path:
    gen9vgc2024regg: constrained
    gen9vgc2026regi: setup
    gen9championsvgc2026regma: null

hardware:
  device: cuda

eval:
  enabled: true
  surplus_alpha: 1.0
  workers: 4
  collect_trajectories: null   # set to e.g. /tmp/eval_run/ to capture parquet for matchup_analysis
  open_team_sheets: "on"
  opponents:
    simple_heuristic: {target: 0.80, weight: 1.0, n_battles: 100}
    max_damage:                {target: 0.80, weight: 1.0, n_battles: 100}
    bc_player:                 {target: 0.80, weight: 1.0, n_battles: 100}
    vgc_bench:                 {target: 0.60, weight: 1.0, n_battles: 200}
    # foul_play:                 {target: 0.50, weight: 0.0, n_battles: 40}  # not implemented
