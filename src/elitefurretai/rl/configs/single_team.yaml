algorithm:
  clip_range: 0.2
  ent_coef: 0.005
  ent_coef_end: 0.001
  gae_lambda: 0.95
  gamma: 1
  max_grad_norm: 0.5
  ppo_epochs: 3
  rnad_alpha: 0.05
  vf_coef: 0.5

portfolio:
  max_portfolio_size: 5
  portfolio_add_interval: 100
  portfolio_update_strategy: recent

exploration:
  temperature_start: 1.0
  temperature_end: 0.5
  temperature_anneal_steps: 10000
  top_p: 0.95

optimizer:
  type: adamw
  weight_decay: 0.0001
  warmup_steps: 100
  schedule: cosine
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0001
  heads_lr: 0.00003
  heads_weight_decay: 0.0
  lr: 0.00001

value_head:
  num_value_bins: 51
  value_min: -1.0
  value_max: 1.0

architecture:
  # Transformer backbone (matching cool-bee-85-finetune: ~26.7M params, ~5x smaller than
  # curious-darkness-77; trained with raw featureset; finetuned for 15 additional epochs).
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 1024
  transformer_dropout: 0.1
  # Encoder
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0.2
  early_attention_heads: 16
  late_attention_heads: 32
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  # Decision heads
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0.15
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]
  max_seq_len: 40
  # Number bank embeddings
  number_bank_hp_bins: 100
  number_bank_stat_bins: 600
  number_bank_power_bins: 250
  number_bank_embedding_dim: 16

hardware:
  batch_size: 4
  batch_timeout: 0.005
  device: cuda
  max_battle_steps: 30
  num_battles_per_pair: 32
  # null = poke-env's default of 1 (battles serialise behind the previous
  # battle's duration). Set to num_battles_per_pair to remove the 5-30s
  # slow-handler tax diagnosed in Track C of the 2026-05-12 planning doc.
  max_concurrent_battles_per_player: null
  num_players: 12
  num_servers: 4
  num_workers: 4
  showdown_start_port: 8000

curriculum:
  battle_format: gen9vgc2024regg
  base_team_path: data/teams
  opponent_team_pool_path: constrained
  agent_team_path: constrained/naicchampion.txt
  bc_model_path: data/models/supervised/cool-bee-85-finetune_best.pt
  curriculum_weights:
    self_play: 0.4
    bc_player: 0.1
    exploiters: 0.0
    ghosts: 0.1
    max_damage: 0.05
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.05
    vgc_bench_baseline: 0.3
    # In-process exploiter co-training. Set to 0.20 to activate (recommended
    # default when on). Off by default; pipeline lies dormant when 0.0.
    train_exploiter: 0.0
  adaptive_curriculum: false
  max_exploiter_models: 5
  max_ghosts: 5
  vgc_bench_checkpoint_path: data/models/vgc-bench-sb3-model.zip
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  embedder_feature_set: raw
  # Resume from the periodic ghost-pool checkpoint at step 875 of run
  # bright-pine-189 (the last checkpoint produced before the 2026-05-12
  # 02:06 WSL crash). save_checkpoint writes the same full state dict to
  # <run_dir>/ghosts/ and <run_dir>/ — the "ghosts/" prefix is about
  # opponent-pool membership, not file format — so this file has model
  # weights AND optimizer state AND step counter. Using resume_from
  # preserves Adam moments and step=875. See
  # planning/stage2/2026-05-12-09-30-second-wsl-crash-and-watchdog.md.
  initialize_path: data/models/supervised/cool-bee-85-finetune_best.pt
  resume_from: null
  max_updates: 100000
  save_dir: data/models/rl
  train_batch_size: 256
  checkpoint_interval: 100
  log_interval: 1
  use_wandb: true
  wandb_project: elitefurretai-instruct
  wandb_run_name: null
  # WSL2 has 23 GiB; 20 GB threshold leaves ~3 GiB headroom for the
  # in-flight learner step + checkpoint save when the watchdog trips.
  # See planning/stage2/2026-05-12-09-30-second-wsl-crash-and-watchdog.md.
  memory_watchdog_threshold_gb: 20.0

# ── Exploiter co-training (in-process, league-style graduation) ─────────────
# Off by default — curriculum.curriculum_weights.train_exploiter == 0.0 is
# the single gate. Bump that to 0.20 to activate; the knobs below take effect
# automatically once the pipeline is live.
#
# Each generation trains until win_rate > graduation_threshold over the last
# graduation_window battles, OR max_updates_per_generation hits. On graduation:
# snapshot saved to <run_dir>/exploiters/, fresh exploiter initialized from
# bc_model_path, victim refreshed from current main.
exploiter:
  batch_size: 64                       # smaller than main's 256 (sees ~20% of trajectories)
  graduation_threshold: 0.65           # win-rate gate for snapshotting
  graduation_window: 1000              # rolling window for win-rate calc
  max_updates_per_generation: 5000     # stall safeguard
  victim_refresh_interval: 1000        # main updates between victim weight refreshes
  warmup_updates: 200                  # main updates before exploiter starts (let main settle)
  lr: 0.0001                           # slow chase for stability (main's heads_lr is 3e-5 here)
  ent_coef: 0.02                       # entropy bonus for the exploiter learner
