# sep_arch.yaml — ablation: deep value head on top of a BC-initialized trunk.
#
# Why this config exists
# ----------------------
# Background: the 2026-05-11 single_team run at update 657 had value loss
# dominating policy loss 3:1 through the shared transformer backbone
# (policy=0.91, vf_coef * value = 1.0 * 2.87 = 2.87). single_team.yaml
# subsequently dropped vf_coef to 0.5 as a quick rebalance, but value
# gradients still flow through the same shared trunk and continue to shape
# representation alongside policy.
#
# This config tests a more decoupled approach: deepen the value head with
# its own ResidualBlock stack so the value head can do its return-prediction
# work *after* the shared trunk, rather than asking the trunk to encode
# return-prediction features alongside discriminative policy features.
# Trunk depth (transformer_layers=4) is held constant so we can attribute
# any observed delta to the head split alone, not a confounded trunk
# change. The BC checkpoint loads partially: encoder + trunk + policy head
# from cool-bee-85-finetune, value head fresh-initialized (its old shape
# doesn't match).
#
# What to compare against
# -----------------------
# Run this side-by-side with single_team.yaml (same vf_coef=0.5, same
# everything else). If policy loss starts moving meaningfully sooner here
# than in the baseline, the deep value head is doing useful decoupling
# work. If value loss converges similarly but policy stays flat, value
# capacity wasn't the bottleneck — gradient dominance was, and the next
# experiment should be stop-gradient from value into the trunk.

algorithm:
  clip_range: 0.2
  ent_coef: 0.005
  ent_coef_end: 0.001
  gae_lambda: 0.95
  gamma: 1
  max_grad_norm: 0.5
  rnad_alpha: 0.05
  vf_coef: 0.5

portfolio:
  max_portfolio_size: 5
  portfolio_add_interval: 100
  portfolio_update_strategy: recent

exploration:
  temperature_start: 1.0
  temperature_end: 0.5
  temperature_anneal_steps: 10000
  top_p: 0.95

optimizer:
  type: adamw
  weight_decay: 0.0001
  warmup_steps: 100
  schedule: cosine
  backbone_lr: 0.00001
  backbone_weight_decay: 0.0001
  heads_lr: 0.00003
  heads_weight_decay: 0.0
  lr: 0.00001

value_head:
  num_value_bins: 51
  value_min: -1.0
  value_max: 1.0

architecture:
  # Transformer backbone (matching cool-bee-85-finetune for clean BC load
  # of the trunk).
  use_transformer: true
  transformer_layers: 4
  transformer_heads: 8
  transformer_ff_dim: 1024
  transformer_dropout: 0.1
  use_decision_tokens: true
  use_causal_mask: true
  # Encoder
  early_layers: [1024, 512, 512]
  late_layers: [512, 512]
  dropout: 0.2
  early_attention_heads: 16
  late_attention_heads: 32
  grouped_encoder_hidden_dim: 256
  grouped_encoder_aggregated_dim: 2048
  pokemon_attention_heads: 8
  # Decision heads
  teampreview_head_layers: [256, 128]
  teampreview_head_dropout: 0.15
  teampreview_attention_heads: 2
  turn_head_layers: [512, 256, 256]
  # Deep value head — the central change vs single_team.yaml. Three
  # ResidualBlocks ([512, 512, 256]) sit between late_ff_stack output
  # (512-dim) and the final Linear projection to num_value_bins. This
  # gives the value head its own integrative depth and pushes
  # return-prediction computation out of the shared trunk. The legacy
  # 2-layer win_head from the BC checkpoint won't strict-load and is
  # fresh-initialized; everything else (encoder, trunk, policy head)
  # loads from cool-bee-85-finetune.
  value_head_layers: [512, 512, 256]
  max_seq_len: 40
  # Number bank embeddings
  number_bank_hp_bins: 100
  number_bank_stat_bins: 600
  number_bank_power_bins: 250
  number_bank_embedding_dim: 16

hardware:
  # 2026-05-13: bumped 4 → 32 after post-vectorization py-spy showed the
  # inference thread spending 34% OwnTime in concurrent.futures._worker
  # (queue-blocking), i.e. the batcher was starving for fuller batches.
  # With ~96 in-flight battles per worker, batches of 4 were under-filled
  # by ~24x.
  batch_size: 32
  batch_timeout: 0.005
  device: cuda
  max_battle_steps: 30
  num_battles_per_pair: 32
  # null = poke-env's default of 1 (battles serialise behind the previous
  # battle's duration). Set to num_battles_per_pair to remove the 5-30s
  # slow-handler tax diagnosed in Track C of the 2026-05-12 planning doc.
  max_concurrent_battles_per_player: 32
  num_players: 12
  # 2026-05-13: tried 1, killed the run via zero-completion watchdog —
  # one node server cannot handle 12*32=384 concurrent battle streams.
  # The 0% OwnTime in py-spy was per-WORKER CPU cost, not Showdown's
  # per-second throughput capacity. Reverted to 4. (Could test 2 or 3
  # later if reclaiming CPU matters.)
  num_servers: 4
  num_workers: 4
  showdown_start_port: 8000
  use_mixed_precision: true
  # torch.compile mode applied to the trainer-side inference model
  # (one compile, one warmup, paid before workers spawn). Set to
  # "default" / "reduce-overhead" / "max-autotune" to enable; null to
  # disable. NOTE: only the highest-traffic model (main) gets compiled
  # — secondary models (bc/exploiter/victim) run eager because of a
  # known torch.compile + multi-thread dynamo race. See
  # ModelRegistry.register's docstring.
  #
  # Centralized inference (legacy CPU-side compile attempt, 2026-05-13):
  # workers used to compile per-process on CPU; that was 30-90s per
  # worker and timed out the 8s inference_request_timeout cascade.
  # Trainer-side compile fixes both: one process, GPU device, paid
  # before workers start.
  compile_inference_model: default
  # Centralized inference: workers send requests to the trainer's
  # ModelRegistry / InferenceServices instead of holding model copies.
  # See src/elitefurretai/rl/RL.md section 8b for the full design.
  enable_centralized_inference: true

curriculum:
  battle_format: gen9vgc2024regg
  base_team_path: data/teams
  team_pool_path: constrained
  agent_team_path: data/teams/gen9vgc2024regg/constrained/naicchampion.txt
  bc_model_path: data/models/supervised/cool-bee-85-finetune_best.pt
  curriculum_weights:
    # self_play + bc_player route through centralized inference;
    # ghosts use the legacy on-demand worker-side loading (registry
    # ghost-slot rotation is "Future work" in the registry plan).
    # max_damage / simple_heuristic / vgc_bench are heuristic / external
    # (no model). exploiters / train_exploiter stay off.
    self_play: 0.3
    bc_player: 0.1
    exploiters: 0.0
    ghosts: 0.1
    max_damage: 0.1
    random_baseline: 0
    max_base_power_baseline: 0
    simple_heuristic_baseline: 0.1
    vgc_bench_baseline: 0.3
    train_exploiter: 0.0
  adaptive_curriculum: false
  max_exploiter_models: 5
  max_ghosts: 5
  vgc_bench_checkpoint_path: data/models/vgc-bench-sb3-model.zip
  external_vgcbench_usernames:
    - VGCBENCH
  external_vgcbench_startup_wait_s: 10.0
  auto_launch_external_vgcbench: true
  external_vgcbench_python_executable: /home/cayman/Repositories/venv-vgcbench/bin/python
  external_vgcbench_team_file: data/teams/gen9vgc2024regg/vgcbench.txt

training:
  embedder_feature_set: raw
  # BC partial-load: trunk/encoder/policy head load from cool-bee-85; the
  # new value_ff_stack + reshaped win_head are fresh-initialized. Strict
  # load is bypassed in train.py's initialize_path branch for sep_arch.
  initialize_path: data/models/supervised/cool-bee-85-finetune_best.pt
  # Resume from step 151 to preserve ~4h of training when relaunching
  # for vectorized _dual_expand profiling (2026-05-13). The vectorization
  # only adds non-persistent buffers so the checkpoint loads cleanly.
  resume_from: data/models/rl/pretty-jazz-4/main_model_step_151.pt
  max_updates: 100000
  save_dir: data/models/rl
  train_batch_size: 256
  checkpoint_interval: 100
  log_interval: 1
  use_wandb: true
  wandb_project: elitefurretai-instruct
  wandb_run_name: null
  # Bumped 20 → 22 for step 6 (full curriculum + centralized): VGCBench
  # external runners (~5.5 GB) + 4 Showdown servers + workers + trainer
  # combined RSS edges over 20 GB on this 24 GB WSL2. 2 GB headroom is
  # enough for normal fluctuation; the watchdog still catches runaway
  # leaks before WSL2 OOM crashes.
  memory_watchdog_threshold_gb: 22.0

# Exploiter co-training disabled for this ablation — keeps the comparison
# against single_team.yaml on equal footing.
exploiter:
  batch_size: 64
  graduation_threshold: 0.65
  graduation_window: 1000
  max_updates_per_generation: 5000
  victim_refresh_interval: 1000
  warmup_updates: 200
  lr: 0.0001
  ent_coef: 0.02
